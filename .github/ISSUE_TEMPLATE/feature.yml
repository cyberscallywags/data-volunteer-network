name: Feature
description: New capability or change in behaviour
labels: [feature]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a ..., I want ..., so that ...
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations: { required: true }
