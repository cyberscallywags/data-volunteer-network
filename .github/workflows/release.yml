# Merge to main  -> re-run CI, then build + push  ghcr.io/<owner>/<repo>/<service>:main and :sha-<commit>
# Push tag vX.Y.Z -> promote that commit's images (no rebuild) to :vX.Y.Z and :latest
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.ref_type == 'branch'
    needs: ci
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { service: api, file: docker/Dockerfile }
          - { service: ui, file: docker/Dockerfile }
          - { service: admin, file: docker/Dockerfile }
          - { service: mobile, file: docker/mobile.Dockerfile }
          - { service: docs, file: docker/docs.Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.PREFIX }}/${{ matrix.service }}:main
            ${{ env.PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  promote:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        service: [api, ui, admin, mobile, docs]
    steps:
      - run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag the tested main image (fails if the commit never went through main)
        env:
          SRC: ${{ env.PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            -t "$PREFIX/${{ matrix.service }}:$VERSION" \
            -t "$PREFIX/${{ matrix.service }}:latest" \
            "$SRC"
