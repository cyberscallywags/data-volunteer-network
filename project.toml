# Project identity. Edit this file, then run `uv run task sync`.
# Content (pages, theme colours, tagline) lives in src/<pkg>/content/site.json.
# The version lives in pyproject.toml.

[project]
name = "Sgaffald"  # display name: titles, app name, docs
slug = "sgaffald"  # lower-case: images, compose project, cache keys
description = "Cyber Scallywags base template: FastAPI, FastUI, Streamlit, Ionic and Neo4j"
year = 2026  # copyright year

[organisation]
name = "Cyber Scallywags"
url = "https://cyberscallywags.com"
motto = "Play • Learn • Share • Grow"

[repository]
# GitHub owner and repository: README badges and the release image prefix,
# ghcr.io/<owner>/<name> (lower-cased, like the release workflow).
owner = "cyberscallywags"
name = "sgaffald"

[mobile]
app_id = "com.cyberscallywags.sgaffald"  # Capacitor appId, reverse-DNS
