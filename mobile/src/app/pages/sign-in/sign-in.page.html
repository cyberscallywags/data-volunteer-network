<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Sign in</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (session.member(); as member) {
    <ion-list inset>
      <ion-item>Signed in as {{ member.name }} ({{ member.email }})</ion-item>
    </ion-list>
    <div class="ion-padding-horizontal">
      <ion-button expand="block" fill="outline" (click)="session.signOut()">Sign out</ion-button>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <ion-list inset>
        <ion-item>
          <ion-input
            label="Name"
            labelPlacement="stacked"
            formControlName="name"
            autocomplete="name"
            errorText="Name is required"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Email"
            labelPlacement="stacked"
            type="email"
            formControlName="email"
            autocomplete="email"
            errorText="Enter a valid email"
          ></ion-input>
        </ion-item>
      </ion-list>
      <div class="ion-padding-horizontal">
        <ion-button type="submit" expand="block">Sign in</ion-button>
      </div>
    </form>
  }
  <ion-note class="ion-padding" color="medium">
    <p>Sign-on is a placeholder until {{ brand().brand.name }} connects an identity provider.</p>
  </ion-note>
</ion-content>
